    <script>
      // Defensive guard against browser extensions (e.g. proxy/VPN extensions) attempting to assign window.fetch when configured as getter-only
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get() { return originalFetch; },
              set(fn) { /* Allow extension assignment without throwing TypeError */ }
            });
          } catch (e) {
            // Already sealed or handled
          }
        }
      } catch (err) {}
    </script>
